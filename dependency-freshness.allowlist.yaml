# Dependencies held below latest stable in this repo, and why. Adds to the
# fleet-wide ~/src/utils/dependency-freshness.allowlist.yaml. `transitive:`
# entries are predicates: they clear themselves when the blocker moves, so
# they carry no `expires`.

exceptions:
  - ecosystem: pypi
    package: librosa
    pinned: "0.11.0"
    latest_known: "1.0.0"
    reason: >-
      chatterbox-tts 0.1.7 exact-pins librosa==0.11.0; tts/ imports librosa
      directly (voicecheck pitch tracking), so it is declared at that pin.
    blocked_by: "transitive:chatterbox-tts@0.1.7"
  - ecosystem: toolchain
    package: python
    pinned: "3.14"
    latest_known: "3.15.1"
    reason: >-
      torch 2.15.0 ships no cp315 wheels (cp314/cp314t only), so the tts/
      venv must be CPython 3.14 (tts/.python-version); uv otherwise picks 3.15
      and `uv sync --locked` fails on torch.
    blocked_by: "transitive:torch@2.15.0"
  - ecosystem: gittag
    package: design_system
    pinned: "0.4.1"
    reason: >-
      design_system 0.5.x depends on flutter_svg 2.5.0, whose
      vector_graphics_compiler (newest, 1.3.6) caps xml at <=7.0.1, while this
      repo pins xml 7.1.0 (newest): pub cannot resolve both, so the shared
      theme waits for the SVG compiler.
    blocked_by: transitive:vector_graphics_compiler@1.3.6
