# Dependencies held below latest stable in this repo, and why. Adds to the
# fleet-wide ~/src/utils/dependency-freshness.allowlist.yaml. `transitive:`
# entries are predicates: they clear themselves when the blocker moves, so
# they carry no `expires`.

exceptions:
  - ecosystem: pypi
    package: librosa
    pinned: "0.11.0"
    latest_known: "1.0.0"
    reason: >-
      chatterbox-tts 0.1.7 exact-pins librosa==0.11.0; tts/ imports librosa
      directly (voicecheck pitch tracking), so it is declared at that pin.
    blocked_by: "transitive:chatterbox-tts@0.1.7"
  - ecosystem: toolchain
    package: python
    pinned: "3.14"
    latest_known: "3.15.1"
    reason: >-
      torch 2.15.0 ships no cp315 wheels (cp314/cp314t only), so the tts/
      venv must be CPython 3.14 (tts/.python-version); uv otherwise picks 3.15
      and `uv sync --locked` fails on torch.
    blocked_by: "transitive:torch@2.15.0"
  - ecosystem: pypi
    package: torchaudio
    pinned: "2.11.0"
    latest_known: "2.11.1"
    reason: >-
      tts/ takes torch and torchaudio from the PyTorch CPU index (no proprietary
      nvidia-*/cuda-* wheels, FOSS audit). That index stops at 2.11.0+cpu; the
      PyPI 2.11.1 wheel links libtorch_cuda.so and libcudart.so.13, so it cannot
      load against torch 2.15.0+cpu. Bump the day 2.11.1+cpu (or newer) appears
      on https://download.pytorch.org/whl/cpu/torchaudio/.
    blocked_by: "index:download.pytorch.org/whl/cpu"
    expires: "2027-02-17"
