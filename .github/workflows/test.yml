name: test

# analyze + format + the unit suite on every push. Separate from release-apk
# so a failing test is visible on its own and does not mask build health.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: analyze, format, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.8
          channel: stable
          cache: true

      - run: flutter pub get
      # The gitignored Firebase identifiers (lib/assist/firebase_local.dart):
      # empty in CI, so the relay reports "not configured" in tests.
      - run: dart run tool/write_firebase_config.dart --placeholder
      - run: flutter analyze
      - run: dart format --output=none --set-exit-if-changed lib bin test
      - run: flutter test --reporter=compact
