[project]
name = "sufler-tts"
version = "0.1.0"
description = "Local Chatterbox Multilingual voice service for sufler"
requires-python = ">=3.14"
dependencies = [
  "chatterbox-tts==0.1.7",
  # The relay's Firebase session, device id and e2e key (relay/), tutor's pin.
  "crdt-sync @ git+https://github.com/kuhyx/utils@crdt-sync-v0.11.1#subdirectory=crdt-sync",
  "faster-whisper==1.2.1",
  "librosa==0.11.0",
  "numpy==2.5.5",
  "torch==2.15.0",
  # 2.11.0: the CPU index has no 2.11.1+cpu, and the PyPI 2.11.1 wheel links
  # libtorch_cuda.so / libcudart.so.13 (see dependency-freshness.allowlist.yaml).
  "torchaudio==2.11.0",
]

# CPU-only torch: the PyPI wheels pull ~3 GB of proprietary nvidia-*/cuda-*
# wheels (FOSS audit). Renders are batched and cached, so CPU speed is enough.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchaudio = { index = "pytorch-cpu" }

[dependency-groups]
dev = ["mypy==2.4.1", "pytest==9.2.0", "ruff==0.17.6"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py314"
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF", "PL", "D"]
ignore = ["D203", "D213", "D401", "PLR2004", "PLR0913", "PLR0917"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D"]

[tool.mypy]
strict = true
python_version = "3.14"

# crdt-sync ships no py.typed: its names are Any here, checked in its own repo.
[[tool.mypy.overrides]]
module = ["crdt_sync", "crdt_sync.*"]
ignore_missing_imports = true
follow_imports = "skip"

[tool.ruff.lint.isort]
known-first-party = ["sufler_tts"]
