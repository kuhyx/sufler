name: sufler
description: "Learn your lines: partner lines read aloud, pause for yours, Anki export."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  archive: 4.5.2
  audioplayers: 6.8.1
  design_system:
    git:
      url: https://github.com/kuhyx/utils
      ref: design_system-v0.2.1
      path: design_system
  file_picker: 13.1.0
  flutter:
    sdk: flutter
  flutter_tts: 4.2.5
  idb_shim: 2.10.1+1
  meta: 1.19.0
  path_provider: 2.1.6
  record: 7.1.2
  share_plus: 13.3.1

dev_dependencies:
  fake_async: 1.3.3
  flutter_test:
    sdk: flutter
  very_good_analysis: ^11.0.0

flutter:
  uses-material-design: true
