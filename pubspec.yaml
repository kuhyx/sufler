name: sufler
description: "Learn your lines: partner lines read aloud, pause for yours, Anki export."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.0

dependencies:
  archive: 4.5.2
  audioplayers: 6.8.1
  # The phone's relay to the PC (lib/assist/): Google sign-in -> Firebase
  # refresh token (keystore) -> ID tokens for RTDB REST. Tutor's pin.
  crdt_sync:
    git:
      url: https://github.com/kuhyx/utils
      ref: crdt_sync_dart-v0.11.1
      path: crdt_sync_dart
  crypto: 3.0.7
  design_system:
    git:
      url: https://github.com/kuhyx/utils
      ref: design_system-v0.2.1
      path: design_system
  file_picker: 13.1.0
  flutter:
    sdk: flutter
  flutter_secure_storage: 11.2.0
  flutter_tts: 4.2.5
  google_sign_in: 7.2.0
  http: 1.6.0
  idb_shim: 2.10.1+1
  meta: 1.19.0
  path: 1.9.1
  path_provider: 2.1.6
  record: 7.1.2
  share_plus: 13.3.1
  speech_to_text: 7.5.0
  sqlite3: 3.8.0
  url_launcher: 6.3.3
  xml: 7.1.0

dev_dependencies:
  fake_async: 1.3.3
  flutter_launcher_icons: 0.14.4
  flutter_test:
    sdk: flutter
  very_good_analysis: ^11.0.0

flutter:
  uses-material-design: true
  # Bundled so the desktop (web) build starts offline: without a family
  # named exactly "Roboto" the web engine fetches it from fonts.gstatic.com.
  # Files: Flutter SDK material_fonts (Apache-2.0); the symbol subset covers
  # "♪" in unheaded song titles (OFL-1.1). See fonts/LICENSE-*.txt.
  fonts:
    - family: Roboto
      fonts:
        - asset: fonts/Roboto-Regular.ttf
        - asset: fonts/Roboto-Italic.ttf
          style: italic
        - asset: fonts/Roboto-Medium.ttf
          weight: 500
        - asset: fonts/Roboto-Bold.ttf
          weight: 700
    - family: SuflerSymbols
      fonts:
        - asset: fonts/SuflerSymbols.ttf

# PYTHONPATH=~/src/testsAndMisc python3 -m python_pkg.app_icons generate --app sufler
# then: dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "#211D1B"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"
  adaptive_icon_monochrome: "assets/icon/icon_monochrome.png"
  min_sdk_android: 21
